
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我的部落格</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.8;
            background: #f7f7f7;
            color: #333;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
        }

        .create-button {
            display: inline-block;
            padding: 10px 18px;
            background: #1769aa;
            color: white;
            border-radius: 6px;
            text-decoration: none;
        }

        .create-button:hover {
            background: #12548a;
        }

        .post {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .post h2 {
            margin-top: 0;
        }

        .post h2 a,
        .read-more {
            color: #1769aa;
            text-decoration: none;
        }

        .post h2 a:hover,
        .read-more:hover {
            text-decoration: underline;
        }

        .author {
            color: #777;
            font-size: 14px;
        }

        .content {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .empty {
            background: white;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>我的部落格</h1>

        <a class="create-button"
           href="{{ url_for('create_post') }}">
            + 發表新文章
        </a>
    </header>

    <main>
        {% for post in posts %}
        <article class="post">

            <h2>
                <a href="{{ url_for('post_detail', post_id=post.id) }}">
                    {{ post.title }}
                </a>
            </h2>

            <p class="author">
                作者：{{ post.author }}
            </p>

            <div class="content">{{ post.content }}</div>

            <p>
                <a class="read-more"
                   href="{{ url_for('post_detail', post_id=post.id) }}">
                    閱讀全文 →
                </a>
            </p>

        </article>
        {% else %}
        <div class="empty">
            <p>目前還沒有任何文章。</p>
            <p>點擊「發表新文章」，開始你的第一篇創作吧！</p>
        </div>
        {% endfor %}
    </main>

</body>
</html>
